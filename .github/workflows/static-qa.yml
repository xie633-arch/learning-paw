name: Static QA

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "**/*.js"
      - "**/*.mjs"
      - "**/*.json"
      - "**/*.webmanifest"
      - "index.html"
      - ".github/workflows/static-qa.yml"

permissions:
  contents: read

concurrency:
  group: static-qa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r file; do
            echo "node --check $file"
            node --check "$file"
          done < <(find . -type f \( -name '*.js' -o -name '*.mjs' \) -not -path './.git/*' | sort)

      - name: JSON syntax
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path

          files = sorted(Path('.').rglob('*.json')) + sorted(Path('.').rglob('*.webmanifest'))
          for path in files:
              if '.git' in path.parts:
                  continue
              print(f'json check {path}')
              json.loads(path.read_text(encoding='utf-8'))
          PY

      - name: Service worker shell references
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import re
          from pathlib import Path

          text = Path('sw.js').read_text(encoding='utf-8')
          match = re.search(r'const APP_SHELL = \[(.*?)\];', text, re.S)
          if not match:
              raise SystemExit('APP_SHELL not found in sw.js')

          refs = re.findall(r"['\"](\./[^'\"]+)['\"]", match.group(1))
          missing = []
          for ref in refs:
              if ref == './':
                  continue
              path = Path(ref[2:])
              if not path.exists():
                  missing.append(ref)

          if missing:
              raise SystemExit('Missing APP_SHELL files: ' + ', '.join(missing))
          print(f'APP_SHELL OK: {len(refs)} references')
          PY

      - name: Learner data migration smoke test
        run: node tests/learner-data-smoke.mjs

      - name: Curriculum content integrity
        run: node tests/content-integrity.mjs

      - name: Prepare browser runtime smoke
        shell: bash
        run: |
          set -euo pipefail
          CHROME_PATH="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          if [ -z "$CHROME_PATH" ]; then
            echo "No Chrome/Chromium executable found on runner" >&2
            exit 1
          fi
          echo "CHROME_PATH=$CHROME_PATH" >> "$GITHUB_ENV"
          npm install --no-save --no-package-lock playwright-core@latest

      - name: Browser runtime smoke test
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/learning-paw-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT

          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then
              break
            fi
            sleep 0.2
          done

          SMOKE_BASE_URL=http://127.0.0.1:4173/ node tests/browser-runtime-smoke.mjs
          SMOKE_BASE_URL=http://127.0.0.1:4173/ node tests/product-lab-smoke.mjs
          SMOKE_BASE_URL=http://127.0.0.1:4173/ node tests/adaptive-loop-smoke.mjs
