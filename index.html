<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#111827" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Learning" />
  <title>Learning｜主动回忆</title>
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="icon" href="./icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="./icon.svg" />
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <div>
        <p class="eyebrow">PERSONAL LEARNING OS</p>
        <h1>Learning</h1>
      </div>
      <div id="engineBadge" class="badge">准备中</div>
    </header>

    <main>
      <section id="homeView" class="view">
        <div class="hero card">
          <p class="muted">今天的目标不是刷分，而是把“好像知道”变成“真的能说出来”。</p>
          <div class="stats-grid">
            <div><strong id="dueCount">0</strong><span>今日到期</span></div>
            <div><strong id="reviewedToday">0</strong><span>今日已复习</span></div>
            <div><strong id="knownToday">0</strong><span>今日认识</span></div>
          </div>
        </div>

        <div class="card controls-card">
          <label for="deckSelect">学习领域</label>
          <select id="deckSelect"></select>

          <label for="sessionSize">本次题量</label>
          <select id="sessionSize">
            <option value="5">5 题｜闪电复习</option>
            <option value="10" selected>10 题｜标准训练</option>
            <option value="20">20 题｜深度复习</option>
            <option value="all">全部到期</option>
          </select>

          <button id="startBtn" class="primary">开始复习</button>
          <p id="emptyHint" class="muted small hidden">当前没有到期卡片。可以切换领域，或稍后再来。</p>
        </div>

        <div class="card explanation-card">
          <h2>这一版怎么用</h2>
          <p>先写下自己的回答，再查看参考答案。系统不会替你判分，只记录你的自评：</p>
          <div class="legend">
            <span>✅ 认识</span>
            <span>🟡 模糊</span>
            <span>❌ 不认识</span>
          </div>
        </div>
      </section>

      <section id="reviewView" class="view hidden">
        <div class="review-topline">
          <button id="exitBtn" class="ghost">退出</button>
          <span id="progressText">1 / 10</span>
        </div>
        <div class="progress-track"><div id="progressBar" class="progress-bar"></div></div>

        <article class="card review-card">
          <div class="question-meta">
            <span id="deckLabel" class="pill"></span>
            <span id="categoryLabel" class="pill subtle"></span>
          </div>
          <img id="questionImage" class="question-image hidden" alt="题目图片" />
          <h2 id="questionText" class="question"></h2>

          <label for="selfAnswer" class="answer-label">先写下你的理解</label>
          <textarea id="selfAnswer" rows="6" placeholder="不用追求完整，先把你真正能回忆出来的内容写下来……"></textarea>
          <p class="muted small">你的输入不会被 AI 判分，只用于帮助主动回忆。</p>

          <button id="revealBtn" class="primary">查看参考答案</button>

          <div id="referenceBlock" class="reference hidden">
            <div class="divider"></div>
            <p class="reference-title">参考答案</p>
            <div id="referenceAnswer" class="reference-answer"></div>

            <p class="self-rate-title">这次掌握得怎么样？</p>
            <div class="rating-grid">
              <button data-rating="good" class="rating good">✅<strong>认识</strong><span>能独立说出来</span></button>
              <button data-rating="hard" class="rating hard">🟡<strong>模糊</strong><span>大概知道但不完整</span></button>
              <button data-rating="again" class="rating again">❌<strong>不认识</strong><span>没有真正掌握</span></button>
            </div>
          </div>
        </article>
      </section>

      <section id="summaryView" class="view hidden">
        <div class="card summary-card">
          <p class="eyebrow">SESSION COMPLETE</p>
          <h2>今天这轮完成了</h2>
          <div class="summary-grid">
            <div><strong id="summaryGood">0</strong><span>✅ 认识</span></div>
            <div><strong id="summaryHard">0</strong><span>🟡 模糊</span></div>
            <div><strong id="summaryAgain">0</strong><span>❌ 不认识</span></div>
          </div>
          <p id="summaryMessage" class="muted"></p>
          <button id="backHomeBtn" class="primary">返回首页</button>
        </div>
      </section>
    </main>

    <footer>
      <span id="networkState">在线</span>
      <span>数据默认保存在当前设备</span>
    </footer>
  </div>

  <script type="module" src="./app.js"></script>
</body>
</html>
